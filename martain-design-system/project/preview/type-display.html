<!DOCTYPE html>
<html lang="nl"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--bg-surface);padding:26px 30px;font-family:var(--font-display);color:var(--fg-strong)}
  .row{display:flex;align-items:baseline;gap:14px;margin-bottom:10px}
  .tag{font-family:var(--font-sans);font-size:11px;color:var(--fg-muted);letter-spacing:.04em}
  .d1{font-size:52px;font-weight:700;letter-spacing:-.02em;line-height:1}
  .d2{font-size:34px;font-weight:600;letter-spacing:-.02em;line-height:1}
  .d3{font-size:24px;font-weight:600;letter-spacing:-.01em;line-height:1}
</style></head>
<body>
  <div class="row"><div class="d1">Slimme AI</div><div class="tag">Poppins · 700 · Display</div></div>
  <div class="row"><div class="d2">die je werk uit handen neemt</div><div class="tag">Poppins · 600 · H2</div></div>
  <div class="row"><div class="d3">Praktisch en verantwoord</div><div class="tag">Poppins · 600 · H3</div></div>
</body></html>

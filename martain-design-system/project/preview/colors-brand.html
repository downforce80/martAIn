<!DOCTYPE html>
<html lang="nl"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--bg-surface);padding:24px 30px;font-family:var(--font-sans)}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
  .sw{border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border)}
  .chip{height:58px}
  .meta{padding:9px 10px 11px}
  .nm{font-family:var(--font-display);font-weight:600;font-size:13px;color:var(--fg-strong)}
  .hx{font-family:var(--font-mono);font-size:10px;color:var(--fg-muted);margin-top:2px}
  .role{font-size:11px;line-height:1.35;color:var(--fg-muted);margin-top:6px}
</style></head>
<body>
  <div class="grid">
    <div class="sw"><div class="chip" style="background:var(--brand-blue)"></div><div class="meta"><div class="nm">Blue</div><div class="hx">#0061D1</div><div class="role">Vertrouwen &amp; betrouwbaarheid</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--brand-sky)"></div><div class="meta"><div class="nm">Sky</div><div class="hx">#15B4FD</div><div class="role">Helderheid &amp; innovatie</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--brand-violet)"></div><div class="meta"><div class="nm">Violet</div><div class="hx">#7A2BD6</div><div class="role">Intelligentie &amp; de AI zelf</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--brand-indigo)"></div><div class="meta"><div class="nm">Indigo</div><div class="hx">#3A1FB8</div><div class="role">Diepte &amp; techniek</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--brand-ink)"></div><div class="meta"><div class="nm">Ink</div><div class="hx">#0A1640</div><div class="role">Geloofwaardigheid &amp; tekst</div></div></div>
  </div>
</body></html>

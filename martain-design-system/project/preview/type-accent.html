<!DOCTYPE html>
<html lang="nl"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--bg-surface);padding:30px;display:flex;flex-direction:column;gap:18px}
  .serif{font-family:var(--font-serif);font-style:italic;font-weight:500;font-size:28px;line-height:1.35;color:var(--fg-strong);max-width:620px}
  .serif .accent{color:var(--brand-violet)}
  .tag{font-family:var(--font-sans);font-size:12px;color:var(--fg-muted)}
  .grad{font-family:var(--font-display);font-weight:800;font-size:40px;letter-spacing:-.02em}
</style></head>
<body>
  <div class="serif">"Geen ruis. Gewoon <span class="accent">AI die je dag lichter maakt.</span>"</div>
  <div class="tag">Lora italic · serif-accentregel (echo van de logo-subline)</div>
  <div class="grad ds-grad-text">MartAIn</div>
  <div class="tag">Brand-gradient tekst · .ds-grad-text</div>
</body></html>

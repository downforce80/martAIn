<!DOCTYPE html>
<html lang="nl"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--gray-100);padding:34px 30px;font-family:var(--font-sans)}
  .row{display:flex;gap:26px}
  .item{display:flex;flex-direction:column;gap:12px;align-items:center}
  .box{width:96px;height:66px;background:#fff;border-radius:var(--radius-md)}
  .nm{font-family:var(--font-display);font-weight:600;font-size:12px;color:var(--fg-strong)}
</style></head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="box-shadow:var(--shadow-xs)"></div><div class="nm">xs</div></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-sm)"></div><div class="nm">sm</div></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-md)"></div><div class="nm">md</div></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-lg)"></div><div class="nm">lg</div></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-brand)"></div><div class="nm">brand</div></div>
  </div>
</body></html>

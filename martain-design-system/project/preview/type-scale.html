<!DOCTYPE html>
<html lang="nl"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--bg-surface);padding:24px 30px;font-family:var(--font-sans)}
  table{border-collapse:collapse;width:100%}
  td{padding:7px 0;border-bottom:1px solid var(--border);vertical-align:baseline}
  .name{font-family:var(--font-mono);font-size:12px;color:var(--fg-muted);width:120px}
  .px{font-family:var(--font-mono);font-size:12px;color:var(--brand-blue);width:64px}
  .spec{font-family:var(--font-display);font-weight:600;color:var(--fg-strong);letter-spacing:-.01em;line-height:1}
</style></head>
<body>
  <table>
    <tr><td class="name">text-5xl</td><td class="px">61</td><td><span class="spec" style="font-size:38px">Aa</span></td></tr>
    <tr><td class="name">text-3xl</td><td class="px">39</td><td><span class="spec" style="font-size:30px">Slimmer werken</span></td></tr>
    <tr><td class="name">text-xl</td><td class="px">25</td><td><span class="spec" style="font-size:23px">Slimmer werken</span></td></tr>
    <tr><td class="name">text-base</td><td class="px">16</td><td><span class="spec" style="font-size:16px;font-weight:500">Slimmer werken met AI</span></td></tr>
    <tr><td class="name">text-sm</td><td class="px">14</td><td><span class="spec" style="font-size:14px;font-weight:500">Slimmer werken met AI</span></td></tr>
  </table>
</body></html>

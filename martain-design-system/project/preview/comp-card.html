<!DOCTYPE html>
<html lang="nl"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--gray-100);padding:26px 30px;font-family:var(--font-sans);display:flex;gap:18px}
  .card{flex:1;background:#fff;border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px;box-shadow:var(--shadow-sm)}
  .ic{width:46px;height:46px;border-radius:var(--radius-md);background:var(--grad-mark);display:flex;align-items:center;justify-content:center;margin-bottom:16px}
  .ic svg{width:24px;height:24px;color:#fff}
  h3{font-family:var(--font-display);font-weight:600;font-size:19px;color:var(--fg-strong);margin:0 0 8px}
  p{font-size:14px;line-height:1.55;color:var(--fg-muted);margin:0}
  .link{font-family:var(--font-display);font-weight:600;font-size:14px;color:var(--brand-blue);margin-top:14px;display:inline-flex;gap:6px;align-items:center}
</style></head>
<body>
  <div class="card">
    <div class="ic"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3m0 12v3M3 12h3m12 0h3M5.6 5.6l2.1 2.1m8.6 8.6l2.1 2.1m0-12.8l-2.1 2.1M7.7 16.3l-2.1 2.1"/><circle cx="12" cy="12" r="3"/></svg></div>
    <h3>Slimme automatisering</h3>
    <p>Standaardwerk zoals offertes, facturen en e-mail automatiseren — betrouwbaar en zonder gedoe.</p>
    <span class="link">Lees meer →</span>
  </div>
  <div class="card">
    <div class="ic" style="background:var(--grad-brand)"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></div>
    <h3>Advies &amp; training</h3>
    <p>Praktische begeleiding en training, zodat je team AI verantwoord en met vertrouwen gebruikt.</p>
    <span class="link">Lees meer →</span>
  </div>
</body></html>

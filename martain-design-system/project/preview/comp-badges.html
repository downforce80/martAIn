<!DOCTYPE html>
<html lang="nl"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--bg-surface);padding:24px 30px;font-family:var(--font-sans);display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .badge{font-family:var(--font-display);font-weight:600;font-size:12px;padding:5px 12px;border-radius:var(--radius-pill);display:inline-flex;align-items:center;gap:6px}
  .dot{width:7px;height:7px;border-radius:50%}
  .b-blue{background:var(--blue-50);color:var(--blue-700)}
  .b-violet{background:var(--violet-50);color:var(--violet-700)}
  .b-suc{background:var(--success-bg);color:var(--success)}
  .b-warn{background:var(--warning-bg);color:var(--warning)}
  .b-ink{background:var(--brand-ink);color:#fff}
  .b-out{background:#fff;border:1px solid var(--border);color:var(--fg-default)}
</style></head>
<body>
  <span class="badge b-blue">Automatisering</span>
  <span class="badge b-violet">AI-advies</span>
  <span class="badge b-suc"><span class="dot" style="background:var(--success)"></span>Live</span>
  <span class="badge b-warn">In ontwikkeling</span>
  <span class="badge b-ink">Training</span>
  <span class="badge b-out">Voor het mkb</span>
</body></html>

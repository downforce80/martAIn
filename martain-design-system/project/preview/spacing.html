<!DOCTYPE html>
<html lang="nl"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--bg-surface);padding:26px 30px;font-family:var(--font-sans)}
  .row{display:flex;align-items:center;gap:14px;margin-bottom:9px}
  .bar{background:var(--grad-sky);height:18px;border-radius:4px}
  .nm{font-family:var(--font-mono);font-size:12px;color:var(--fg-strong);width:62px}
  .px{font-family:var(--font-mono);font-size:11px;color:var(--fg-muted)}
</style></head>
<body>
  <div class="row"><div class="nm">space-1</div><div class="bar" style="width:4px"></div><div class="px">4</div></div>
  <div class="row"><div class="nm">space-2</div><div class="bar" style="width:8px"></div><div class="px">8</div></div>
  <div class="row"><div class="nm">space-4</div><div class="bar" style="width:16px"></div><div class="px">16</div></div>
  <div class="row"><div class="nm">space-6</div><div class="bar" style="width:24px"></div><div class="px">24</div></div>
  <div class="row"><div class="nm">space-8</div><div class="bar" style="width:32px"></div><div class="px">32</div></div>
  <div class="row"><div class="nm">space-12</div><div class="bar" style="width:48px"></div><div class="px">48</div></div>
  <div class="row"><div class="nm">space-20</div><div class="bar" style="width:80px"></div><div class="px">80</div></div>
</body></html>

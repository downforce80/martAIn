<!DOCTYPE html>
<html lang="nl"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--bg-surface);padding:26px 30px;font-family:var(--font-sans)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .g{height:90px;border-radius:var(--radius-md);display:flex;align-items:flex-end;padding:10px 12px;color:#fff;font-family:var(--font-mono);font-size:11px}
  .full{grid-column:1/3}
</style></head>
<body>
  <div class="grid">
    <div class="g full" style="background:var(--grad-brand)">--grad-brand · cobalt → sky → violet</div>
    <div class="g" style="background:var(--grad-deep)">--grad-deep</div>
    <div class="g" style="background:var(--grad-mark)">--grad-mark</div>
  </div>
</body></html>

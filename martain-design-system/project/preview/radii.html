<!DOCTYPE html>
<html lang="nl"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--bg-surface);padding:26px 30px;font-family:var(--font-sans)}
  .row{display:flex;gap:20px;align-items:flex-end}
  .item{display:flex;flex-direction:column;gap:8px;align-items:center}
  .box{width:84px;height:64px;background:var(--blue-50);border:1.5px solid var(--brand-blue);border-bottom-width:0;border-right-width:0}
  .nm{font-family:var(--font-display);font-weight:600;font-size:12px;color:var(--fg-strong)}
  .px{font-family:var(--font-mono);font-size:11px;color:var(--fg-muted)}
</style></head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="border-radius:6px 0 0 0"></div><div class="nm">xs</div><div class="px">6px</div></div>
    <div class="item"><div class="box" style="border-radius:10px 0 0 0"></div><div class="nm">sm</div><div class="px">10px</div></div>
    <div class="item"><div class="box" style="border-radius:14px 0 0 0"></div><div class="nm">md</div><div class="px">14px</div></div>
    <div class="item"><div class="box" style="border-radius:20px 0 0 0"></div><div class="nm">lg</div><div class="px">20px</div></div>
    <div class="item"><div class="box" style="border-radius:28px 0 0 0"></div><div class="nm">xl</div><div class="px">28px</div></div>
    <div class="item"><div class="box" style="border-radius:999px 0 0 0"></div><div class="nm">pill</div><div class="px">999px</div></div>
  </div>
</body></html>

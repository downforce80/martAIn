[build]
  # Static site — no build step. React/Babel/Lucide load via CDN and
  # the JSX is compiled in the browser.
  publish = "martain-design-system/project"
  command = ""

# Serve the website UI kit at the root URL (rewrite: the URL stays "/").
[[redirects]]
  from = "/"
  to = "/ui_kits/website/index.html"
  status = 200
